<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gas-N-Go Job Simulator</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,sans-serif}canvas{display:block}#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:white;text-align:center;padding:20px;pointer-events:none;background:linear-gradient(#101820cc,#10182088)}#ui>*{pointer-events:auto}h1{margin:0;font-size:clamp(32px,7vw,54px);text-shadow:0 3px #d62828}p{max-width:480px;line-height:1.45;background:#0008;padding:10px 14px;border-radius:10px}button{font-size:22px;font-weight:800;padding:15px 32px;border:0;border-radius:14px;background:#ffd23f;color:#222;cursor:pointer}#msg{font-size:14px}#hud{position:fixed;top:12px;left:12px;color:white;background:#101820d9;border:1px solid #ffffff44;padding:10px 14px;border-radius:12px;display:none}
</style></head><body>
<div id="ui"><h1>⛽ GAS-N-GO</h1><p>Pinch your thumb and index finger to grab snacks. Give customers the item in their speech bubble. Hold food near your face to eat it. You can toss anything!</p><button id="btn">Enter VR</button><p id="msg">For Quest 2, enable Hand Tracking in Settings, then open this page in Quest Browser.</p></div><div id="hud"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,ui=document.querySelector('#ui'),btn=document.querySelector('#btn'),msg=document.querySelector('#msg'),hud=document.querySelector('#hud');
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x8ecbff);const camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.02,100);camera.position.set(0,1.6,.3);
scene.add(new T.HemisphereLight(0xffffff,0x75634f,2));const light=new T.DirectionalLight(0xfff0d8,2);light.position.set(-3,8,4);scene.add(light);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const mat=(c)=>new T.MeshStandardMaterial({color:c,roughness:.8}),basic=(c)=>new T.MeshBasicMaterial({color:c});
function box(w,h,d,c,x,y,z,parent=scene){const o=new T.Mesh(new T.BoxGeometry(w,h,d),typeof c==='number'?mat(c):c);o.position.set(x,y,z);parent.add(o);return o}
function label(text,x,y,z,color='#ffd23f',bg='#d62828',w=2,h=.45){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const g=cv.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,512,128);g.strokeStyle=color;g.lineWidth=7;g.strokeRect(6,6,500,116);g.fillStyle=color;g.textAlign='center';g.textBaseline='middle';g.font='bold 56px sans-serif';g.fillText(text,256,64);const tx=new T.CanvasTexture(cv);const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tx}));m.position.set(x,y,z);scene.add(m);return m}
const floor=box(8,.12,8,0x2f7d62,0,-.08,-.2);box(2.7,3,.15,0xf3e9d2,-2.65,1.5,-4);box(2.7,3,.15,0xf3e9d2,2.65,1.5,-4);box(2.6,.75,.15,0xf3e9d2,0,2.625,-4);box(.15,3,8,0xf3e9d2,-4,1.5,-.2);box(.15,3,8,0xf3e9d2,4,1.5,-.2);box(8,.12,8,0xd62828,0,3,-.2);label('GAS-N-GO',0,2.55,-3.89,'#ffd23f','#d62828',3,.55);label('HOT DOGS  $1.50',-3.89,1.8,1.8,'#fff','#b3261e',1.5,.35);label('COLD DRINKS',3.89,1.8,.8,'#fff','#1d4e89',1.2,.35).rotation.y=-Math.PI/2;
box(2.8,.95,.7,0x3a506b,0,.48,-.45);box(2.9,.06,.75,0x1c2541,0,.99,-.45);label('PAY HERE',0,1.65,-.8,'#fff','#1c2541',1.2,.3);
const shelves=[];function shelf(x,z,title,types){box(1.5,1.7,.35,0x777c85,x,.85,z);label(title,x,1.95,z-.2,'#ffd23f','#222',1.35,.25);for(let row=0;row<3;row++){box(1.55,.045,.5,0xb98a5a,x,.35+row*.48,z-.05);for(let i=0;i<4;i++)spawnItem(types[(i+row)%types.length],new T.Vector3(x-.55+i*.36,.43+row*.48,z-.18));}}
const defs={
 banana:{name:'Banana',emoji:'🍌',price:1.5,color:0xffdf32,size:.11},
 apple:{name:'Apple',emoji:'🍎',price:1,color:0xd62828,size:.09},
 hotdog:{name:'Hot Dog',emoji:'🌭',price:2,color:0xe0a458,size:.12},
 soda:{name:'Soda',emoji:'🥤',price:1.75,color:0xe63946,size:.1},
 chips:{name:'Chips',emoji:'🥔',price:2.25,color:0xf4a261,size:.12},
 donut:{name:'Donut',emoji:'🍩',price:1.25,color:0xf78fb3,size:.09},
 coffee:{name:'Coffee',emoji:'☕',price:2.5,color:0x8b5a2b,size:.1},
 water:{name:'Water',emoji:'💧',price:1.25,color:0x9fe0ff,size:.1},
 candy:{name:'Candy',emoji:'🍫',price:1,color:0x6b3e26,size:.09}
};
const items=[];function spawnItem(type,pos){const d=defs[type],g=new T.Group();let o;if(type==='banana'){o=new T.Mesh(new T.TorusGeometry(.065,.018,6,12,Math.PI*.85),mat(d.color));o.rotation.z=.4;}else if(type==='donut'){o=new T.Mesh(new T.TorusGeometry(.055,.025,8,14),mat(d.color));}else if(type==='soda'||type==='water'||type==='coffee'){o=new T.Mesh(new T.CylinderGeometry(.045,.04,.14,12),mat(d.color));}else if(type==='apple'){o=new T.Mesh(new T.SphereGeometry(.052,12,10),mat(d.color));}else if(type==='hotdog'){o=box(.17,.06,.06,d.color,0,0,0,g);}else{o=box(.14,.18,.055,d.color,0,0,0,g);}g.add(o);g.position.copy(pos);g.userData={type,vel:new T.Vector3(),held:null,r:d.size};scene.add(g);items.push(g);return g}
shelf(-2.75,1.6,'SNACKS',['banana','apple','chips','donut','candy']);shelf(2.75,1.55,'DRINKS',['soda','water','coffee']);
for(let i=0;i<4;i++)spawnItem(['hotdog','chips','soda','donut'][i],new T.Vector3(-.8+i*.5,1.08,-.48));
box(.35,.12,.28,0x222222,1.1,1.07,-.45);label('OPEN',0,2.2,-3.89,'#ff4d6d','#101030',.9,.3);
const hands=[0,1].map(i=>{const h=renderer.xr.getHand(i);scene.add(h);return{h,pinch:false,held:null,prev:new T.Vector3(),hist:[]}});const v1=new T.Vector3(),v2=new T.Vector3(),mouth=new T.Vector3(),forward=new T.Vector3();let score=0,served=0,customer=null,nextCustomer=1,elapsed=0;
const skin=[0xf1c27d,0xe0ac69,0xc68642,0x8d5524,0xffdbac],shirts=[0x3a86ff,0xff006e,0x8338ec,0xfb5607,0x06d6a0];
function bubble(text){const cv=document.createElement('canvas');cv.width=512;cv.height=160;const g=cv.getContext('2d');g.fillStyle='#fff';g.strokeStyle='#222';g.lineWidth=8;g.beginPath();g.roundRect(8,8,496,130,28);g.fill();g.stroke();g.fillStyle='#111';g.font='bold 45px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,74);const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(cv),depthTest:false}));s.scale.set(1.15,.36,1);s.position.y=2.15;s.renderOrder=5;return s}
function spawnCustomer(){const type=Object.keys(defs)[Math.floor(Math.random()*Object.keys(defs).length)],g=new T.Group(),shirt=mat(shirts[Math.floor(Math.random()*shirts.length)]),sk=mat(skin[Math.floor(Math.random()*skin.length)]);box(.42,.65,.25,shirt,0,1.05,0,g);const head=new T.Mesh(new T.SphereGeometry(.14,12,10),sk);head.position.y=1.55;g.add(head);for(const x of[-.11,.11]){const leg=box(.12,.72,.13,0x2b2d42,x,.36,0,g);leg.userData.leg=true}const bubbleObj=bubble('I want '+defs[type].emoji+' '+defs[type].name);bubbleObj.visible=false;g.add(bubbleObj);g.position.set(2.4,0,-6.2);scene.add(g);customer={g,type,bubble:bubbleObj,state:'enter',phase:0,legs:g.children.filter(o=>o.userData.leg),walk:0};}
function moveCustomer(dt){if(!customer){nextCustomer-=dt;if(nextCustomer<=0)spawnCustomer();return}const c=customer;c.walk+=dt*9;if(c.state==='enter'){const target=c.phase===0?new T.Vector3(2.1,0,-3.2):new T.Vector3(.2,0,-1.25);const dx=target.x-c.g.position.x,dz=target.z-c.g.position.z,d=Math.hypot(dx,dz),step=Math.min(d,1.05*dt);if(d<.07){c.phase++;if(c.phase>=2){c.state='wait';c.bubble.visible=true}}else{c.g.position.x+=dx/d*step;c.g.position.z+=dz/d*step;c.g.rotation.y=Math.atan2(dx,dz);c.legs.forEach((l,i)=>l.rotation.x=Math.sin(c.walk+(i*Math.PI))*.55)}}
else if(c.state==='leave'){const target=new T.Vector3(2.4,0,-6.2),dx=target.x-c.g.position.x,dz=target.z-c.g.position.z,d=Math.hypot(dx,dz),step=Math.min(d,1.25*dt);if(d<.1){scene.remove(c.g);customer=null;nextCustomer=1.4}else{c.g.position.x+=dx/d*step;c.g.position.z+=dz/d*step;c.g.rotation.y=Math.atan2(dx,dz)}}}
function removeItem(it){scene.remove(it);const i=items.indexOf(it);if(i>=0)items.splice(i,1);if(it.userData.held)it.userData.held.held=null}
function release(st,now){if(!st.held)return;const it=st.held;it.userData.held=null;st.held=null;if(st.hist.length>1){const a=st.hist[0],b=st.hist[st.hist.length-1],dt=(b.t-a.t)/1000;if(dt>.02)it.userData.vel.copy(b.p).sub(a.p).divideScalar(dt).clampLength(0,7)}}
function handUpdate(st,now){const J=st.h.joints,a=J['index-finger-tip'],b=J['thumb-tip'];if(!a||!b||!a.visible||!b.visible){if(st.pinch){st.pinch=false;release(st,now)}return}a.getWorldPosition(v1);b.getWorldPosition(v2);const pinchDist=v1.distanceTo(v2),p=v1.add(v2).multiplyScalar(.5);if(!st.pinch&&pinchDist<.027){st.pinch=true;st.hist=[];let best=null,bd=.15;for(const it of items){if(it.userData.held)continue;const d=it.position.distanceTo(p);if(d<bd){bd=d;best=it}}if(best){best.userData.held=st;st.held=best;best.userData.vel.set(0,0,0)}}else if(st.pinch&&pinchDist>.05){st.pinch=false;release(st,now)}if(st.held){st.held.position.copy(p);st.hist.push({p:p.clone(),t:now});if(st.hist.length>7)st.hist.shift();if(customer&&customer.state==='wait'&&st.held.userData.type===customer.type&&st.held.position.distanceTo(new T.Vector3(customer.g.position.x,1.25,customer.g.position.z))<.65){const d=defs[customer.type];removeItem(st.held);served++;score+=d.price;customer.bubble.material.map.dispose();customer.bubble.material.map=null;customer.bubble.visible=false;const thank=bubble('😊 Thanks!');customer.g.add(thank);customer.bubble=thank;customer.state='leave';hud.textContent='Served: '+served+'  •  Tips & sales: $'+score.toFixed(2)}}}
function updateItems(dt){for(const it of items.slice()){const u=it.userData;if(u.held)continue;u.vel.y-=9.8*dt;it.position.addScaledVector(u.vel,dt);if(it.position.y<u.r+.02){it.position.y=u.r+.02;u.vel.y=0;u.vel.x*=.75;u.vel.z*=.75}if(it.position.y>2.8){it.position.y=2.8;u.vel.y=0}u.vel.multiplyScalar(Math.max(0,1-dt*.7));it.rotation.x+=u.vel.z*dt;it.rotation.z-=u.vel.x*dt;if(Math.abs(it.position.x)>3.75){it.position.x=Math.sign(it.position.x)*3.75;u.vel.x*=-.3}if(it.position.z>3.7){it.position.z=3.7;u.vel.z*=-.3}}}
function eatHeld(){const xrCam=renderer.xr.getCamera();xrCam.getWorldDirection(forward);mouth.setFromMatrixPosition(xrCam.matrixWorld).addScaledVector(forward,.16);mouth.y-=.1;for(const st of hands){if(st.held&&st.held.userData.type!=='money'&&st.held.position.distanceTo(mouth)<.17){const it=st.held;removeItem(it);hud.textContent='Munch! Served: '+served+'  •  Sales: $'+score.toFixed(2)}}}
renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min(.05,Math.max(0,(now-(renderer.userData.last||now))/1000));renderer.userData.last=now;hands.forEach(h=>handUpdate(h,now));updateItems(dt);moveCustomer(dt);eatHeld();renderer.render(scene,camera)});
if(!navigator.xr){btn.textContent='WebXR unavailable';btn.disabled=true;msg.textContent='Open this page over HTTPS in Meta Quest Browser.'}
btn.addEventListener('click',()=>{try{const sessionPromise=navigator.xr.requestSession('immersive-vr',{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking','bounded-floor']});sessionPromise.then(s=>{renderer.xr.setSession(s).then(()=>{ui.style.display='none';hud.style.display='block';hud.textContent='Served: 0  •  Sales: $0.00';s.addEventListener('end',()=>{ui.style.display='flex';hud.style.display='none';hands.forEach(h=>release(h,performance.now()))})}).catch(e=>{msg.textContent='VR setup failed: '+e.message})}).catch(e=>{msg.textContent='Could not start VR: '+e.message})}catch(e){msg.textContent='Could not start VR: '+e.message}});
})();
</script></body></html>
