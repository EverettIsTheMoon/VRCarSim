const T=THREE;
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x8ecbff);
const camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.02,80);camera.position.set(0,1.6,.4);

// ---------- helpers ----------
const M=(c,o)=>new T.MeshLambertMaterial(Object.assign({color:c},o||{}));
const B=(c)=>new T.MeshBasicMaterial({color:c});
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
// --- static batching: decor is merged into ONE vertex-colored mesh ---
const gB=new T.BoxGeometry(1,1,1),gS=new T.SphereGeometry(1,8,6);
const SP=[],SN=[],SC=[],SI=[];let SV=0;const _m=new T.Matrix4(),_q=new T.Quaternion(),_e=new T.Euler(),_p=new T.Vector3(),_s=new T.Vector3(),_n=new T.Matrix3(),_v=new T.Vector3(),_c=new T.Color();
function addS(geo,col,x,y,z,rx,ry,rz,sx,sy,sz){_e.set(rx||0,ry||0,rz||0);_q.setFromEuler(_e);_p.set(x,y,z);_s.set(sx||1,sy||1,sz||1);_m.compose(_p,_q,_s);_n.getNormalMatrix(_m);_c.set(col);
  const P=geo.attributes.position,N=geo.attributes.normal,I=geo.index;
  for(let i=0;i<P.count;i++){_v.fromBufferAttribute(P,i).applyMatrix4(_m);SP.push(_v.x,_v.y,_v.z);_v.fromBufferAttribute(N,i).applyMatrix3(_n).normalize();SN.push(_v.x,_v.y,_v.z);SC.push(_c.r,_c.g,_c.b)}
  for(let i=0;i<I.count;i++)SI.push(I.getX(i)+SV);SV+=P.count}
function flushStatic(){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(SP,3));g.setAttribute('normal',new T.Float32BufferAttribute(SN,3));g.setAttribute('color',new T.Float32BufferAttribute(SC,3));g.setIndex(new T.Uint32BufferAttribute(SI,1));
  const m=new T.Mesh(g,new T.MeshLambertMaterial({vertexColors:true}));m.matrixAutoUpdate=false;scene.add(m);SP.length=SN.length=SC.length=SI.length=0}
function box(w,h,d,m,x,y,z,par){if(!par&&!m.transparent){addS(gB,m.color.getHex(),x,y,z,0,0,0,w,h,d);return null}
  const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(par||scene).add(o);return o}
function cyl(a,b,h,m,seg){return new T.Mesh(new T.CylinderGeometry(a,b,h,seg||12),m)}
function cvs(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return new T.CanvasTexture(c)}
function sign(txt,sub,w,h,bg,fg,x,y,z,ry){
  const t=cvs(512,Math.round(512*h/w),(g,W,H)=>{g.fillStyle=bg;g.fillRect(0,0,W,H);g.strokeStyle=fg;g.lineWidth=8;g.strokeRect(10,10,W-20,H-20);
    g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.font='bold '+(sub?H*.34:H*.44)+'px sans-serif';g.fillText(txt,W/2,sub?H*.38:H/2);
    if(sub){g.font='bold '+H*.17+'px sans-serif';g.fillText(sub,W/2,H*.74)}});
  const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:t}));m.position.set(x,y,z);m.rotation.y=ry||0;scene.add(m);return m}

// ---------- items ----------
const defs={

 soda:{e:'🥤',n:'Soda',p:1.75,c:0xe63946,r:.06,mk(g){g.add(cyl(.032,.032,.12,M(0xe63946)));g.add(cyl(.033,.033,.035,M(0xffffff)));const t=cyl(.027,.027,.006,M(0xcccccc));t.position.y=.063;g.add(t)}},
 chips:{e:'🥔',n:'Chips',p:2.25,c:0xf4a261,r:.11,mk(g){box(.15,.22,.04,M(0xf4a261),0,0,0,g);box(.1,.08,.042,M(0xffe066),0,0,0,g)}},
 donut:{e:'🍩',n:'Donut',p:1.25,c:0xf78fb3,r:.02,mk(g){const a=new T.Mesh(new T.TorusGeometry(.035,.015,8,14),M(0xe9b872));a.rotation.x=Math.PI/2;g.add(a);const b=new T.Mesh(new T.TorusGeometry(.035,.012,8,14),M(0xf78fb3));b.rotation.x=Math.PI/2;b.position.y=.008;g.add(b)}},
 coffee:{e:'☕',n:'Coffee',p:2.5,c:0xffffff,r:.055,mk(g){g.add(cyl(.036,.027,.1,M(0xffffff)));const s=cyl(.034,.03,.04,M(0x8b5a2b));g.add(s);const l=cyl(.038,.038,.012,M(0x222222));l.position.y=.056;g.add(l)}},
 candy:{e:'🍫',n:'Candy bar',p:1,c:0x6b3e26,r:.015,mk(g){box(.13,.02,.05,M(0x6b3e26),0,0,0,g);box(.09,.022,.052,M(0x3a86ff),0,0,0,g)}},
 water:{e:'💧',n:'Water',p:1.25,c:0x9fe0ff,r:.1,mk(g){g.add(cyl(.028,.028,.2,M(0x9fe0ff,{transparent:true,opacity:.65})));const c=cyl(.014,.014,.02,M(0xffffff));c.position.y=.11;g.add(c);g.add(cyl(.0295,.0295,.06,M(0xffffff)))}},
 money:{e:'💵',n:'Money',p:0,c:0x4caf50,r:.006,mk(g){box(.15,.003,.065,M(0x4caf50),0,0,0,g);box(.08,.0035,.04,M(0xa5d6a7),0,0,0,g)}}
};
const items=[];
function spawn(type,pos){const d=defs[type],g=new T.Group();d.mk(g);g.position.copy(pos);g.position.y+=d.r;g.rotation.y=rnd(0,6.28);
  g.userData={type,r:d.r,vel:new T.Vector3(),held:null,dead:false};scene.add(g);items.push(g);return g}
function removeItem(it){it.userData.dead=true;if(it.userData.held)it.userData.held.held=null;scene.remove(it);const i=items.indexOf(it);if(i>=0)items.splice(i,1)}
const eul=new T.Euler();
function phys(it,dt){const u=it.userData;if(u.held)return;const p=it.position,r=u.r,prev=p.y-r;
  u.vel.y-=9.8*dt;p.addScaledVector(u.vel,dt);let ground=false;
  for(const s of surf){
    if(p.x>s.x0&&p.x<s.x1&&p.z>s.z0&&p.z<s.z1&&prev>=s.y-.03&&p.y-r<=s.y&&u.vel.y<=0){p.y=s.y+r;u.vel.y=0;ground=true}
    else if(s.solid&&p.y-r<s.y-.03&&p.x>s.x0-r&&p.x<s.x1+r&&p.z>s.z0-r&&p.z<s.z1+r){
      const d=[p.x-(s.x0-r),(s.x1+r)-p.x,p.z-(s.z0-r),(s.z1+r)-p.z],m=Math.min(...d),k=d.indexOf(m);
      if(k==0)p.x=s.x0-r;else if(k==1)p.x=s.x1+r;else if(k==2)p.z=s.z0-r;else p.z=s.z1+r;
      u.vel.x*=-.2;u.vel.z*=-.2}}
  if(p.y-r<=0){p.y=r;u.vel.y=0;ground=true}
  if(p.y>2.9){p.y=2.9;u.vel.y=0}
  if(p.x<-3.85||p.x>3.85){p.x=Math.max(-3.85,Math.min(3.85,p.x));u.vel.x*=-.3}
  if(p.z<-3.85||p.z>2.85){p.z=Math.max(-3.85,Math.min(2.85,p.z));u.vel.z*=-.3}
  if(ground){const f=Math.max(0,1-8*dt);u.vel.x*=f;u.vel.z*=f;eul.setFromQuaternion(it.quaternion,'YXZ');eul.x=eul.z=0;it.quaternion.setFromEuler(eul)}}

// ---------- audio & particles ----------
let ac;
function tone(f,d,type,v,sl){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(f*sl,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
function crunch(){try{ac=ac||new AudioContext();const n=ac.sampleRate*.15,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n)*(i%900<450?1:.3);const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=.3;s.buffer=b;s.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
const parts=[],partG=new T.BoxGeometry(.014,.014,.014);
function burst(pos,col){for(let i=0;i<30;i++){const m=new T.Mesh(partG,B(i%3?col:0xffffff));m.position.copy(pos);m.userData={v:new T.Vector3(rnd(-1,1),rnd(0,1.6),rnd(-1,1)).multiplyScalar(1.1),l:rnd(.5,1)};m.scale.setScalar(rnd(.7,1.8));scene.add(m);parts.push(m)}}

// ---------- gloves & hands ----------
const sph=new T.SphereGeometry(1,8,6),glove=M(0xf4f4f4),cuff=M(0xd62828);
const hands=[0,1].map(i=>{const h=renderer.xr.getHand(i);scene.add(h);return{h,pinch:false,held:null,hist:[],pp:new T.Vector3(),tip:M(0xf4f4f4)}});
const va=new T.Vector3(),vb=new T.Vector3();
function dress(st){const J=st.h.joints;for(const n in J){const j=J[n];if(j.userData.g)continue;j.userData.g=1;
  const tip=n==='index-finger-tip'||n==='thumb-tip',meta=n.includes('metacarpal');
  const s=new T.Mesh(sph,n==='wrist'?cuff:tip?st.tip:glove);s.scale.setScalar((j.jointRadius||.008)*(n==='wrist'?4:meta?2.6:1.8));j.add(s)}}
function release(st,now){if(!st.held)return;const it=st.held,u=it.userData,h=st.hist;u.held=null;st.held=null;
  if(h.length>1){const a=h[0],b=h[h.length-1],dt=(b.t-a.t)/1000;if(dt>.02){u.vel.copy(b.p).sub(a.p).divideScalar(dt);if(u.vel.length()>7)u.vel.setLength(7)}}}
function handUpdate(st,now){dress(st);const J=st.h.joints,a=J['index-finger-tip'],b=J['thumb-tip'];
  if(!a||!b||!a.visible||!b.visible){if(st.pinch){st.pinch=false;release(st,now)}return}
  a.getWorldPosition(va);b.getWorldPosition(vb);const d=va.distanceTo(vb);st.pp.copy(va).add(vb).multiplyScalar(.5);
  if(!st.pinch&&d<.025){st.pinch=true;st.tip.color.set(0x3ddc84);st.hist=[];
    let best=null,bd=1;for(const it of items){if(it.userData.held)continue;const dd=it.position.distanceTo(st.pp)-it.userData.r;if(dd<.07&&dd<bd){best=it;bd=dd}}
    if(best){best.userData.held=st;st.held=best;best.userData.vel.set(0,0,0);tone(500,.06,'square',.05)}}
  else if(st.pinch&&d>.045){st.pinch=false;st.tip.color.set(0xf4f4f4);release(st,now)}
  if(st.held){st.held.position.copy(st.pp);st.hist.push({p:st.pp.clone(),t:now});if(st.hist.length>6)st.hist.shift()}}

// ---------- customers ----------
const skins=[0xf1c27d,0xe0ac69,0xc68642,0x8d5524,0xffdbac],shirts=[0x3a86ff,0xff006e,0x8338ec,0xfb5607,0x06d6a0,0x118ab2,0xef476f];
function bubble(txt,col){const t=cvs(512,200,(g,W,H)=>{g.fillStyle=col||'#fff';g.strokeStyle='#222';g.lineWidth=8;g.beginPath();g.moveTo(40,10);g.lineTo(W-40,10);g.quadraticCurveTo(W-8,10,W-8,45);g.lineTo(W-8,115);g.quadraticCurveTo(W-8,150,W-40,150);g.lineTo(290,150);g.lineTo(256,192);g.lineTo(230,150);g.lineTo(40,150);g.quadraticCurveTo(8,150,8,115);g.lineTo(8,45);g.quadraticCurveTo(8,10,40,10);g.fill();g.stroke();
  g.fillStyle='#111';g.textAlign='center';g.textBaseline='middle';g.font='bold 62px sans-serif';g.fillText(txt,W/2,80)});
  const s=new T.Sprite(new T.SpriteMaterial({map:t,depthTest:false}));s.scale.set(.8,.312,1);s.position.y=2.15;s.renderOrder=10;return s}
let cust=null,nextT=1,lastWant='',ct=0;
const types=Object.keys(defs).filter(k=>k!=='money');
function spawnCust(){let w;do{w=pick(types)}while(w===lastWant);lastWant=w;
  const g=new T.Group(),sk=M(pick(skins)),sh=M(pick(shirts)),pa=M(0x2b2d42);
  const legs=[-1,1].map(s=>{const p=new T.Group();p.position.set(s*.1,.8,0);const m=cyl(.065,.06,.8,pa,8);m.position.y=-.4;p.add(m);g.add(p);return p});
  box(.42,.62,.24,sh,0,1.11,0,g);
  const hd=new T.Mesh(new T.SphereGeometry(.13,12,10),sk);hd.position.y=1.6;g.add(hd);
  const hm=M(pick(shirts));const hat=cyl(.135,.14,.07,hm);hat.position.y=1.7;g.add(hat);box(.2,.015,.12,hm,0,1.67,.14,g);
  for(const s of[-1,1]){const e=new T.Mesh(new T.SphereGeometry(.015,6,6),B(0x111111));e.position.set(s*.05,1.62,.12);g.add(e)}
  const la=cyl(.045,.04,.55,sh,8);la.position.set(-.26,1.1,0);g.add(la);
  const arm=new T.Group();arm.position.set(.22,1.32,0);const am=cyl(.045,.04,.42,sh,8);am.rotation.x=Math.PI/2;am.position.z=.2;arm.add(am);
  const hand=new T.Mesh(new T.SphereGeometry(.05,8,8),sk);hand.position.z=.43;arm.add(hand);g.add(arm);
  const spr=bubble(defs[w].e+' '+defs[w].n);spr.visible=false;g.add(spr);
  const x=rnd(-.6,.6);g.position.set(2.4,0,-6.5);scene.add(g);
  cust={g,legs,arm,spr,want:w,state:'enter',path:[[2.4,-3],[x,-1.25]],pi:0,shake:0};}
function serve(c,it){const d=defs[c.want];removeItem(it);cha();served++;money+=d.p;drawReg();
  c.spr.material.map=bubble('😊 Thanks!','#c8f7c5').material.map;c.state='leave';c.path=[[2.4,-3],[2.4,-6.5]];c.pi=0;c.g.remove(c.spr);c.spr.visible=true;c.g.add(c.spr);
  const n=Math.max(1,Math.ceil(d.p));for(let i=0;i<n;i++){spawn('money',new T.Vector3(c.g.position.x*.5+rnd(-.2,.2),1.1+i*.02,-.45+rnd(-.1,.1)))}
  const bills=items.filter(i=>i.userData.type==='money');while(bills.length>24)removeItem(bills.shift())}
function cha(){tone(1200,.15,'triangle',.18);setTimeout(()=>tone(1800,.35,'triangle',.18),120)}
const hp=new T.Vector3();
function custUpdate(dt){ct+=dt;
  if(!cust){nextT-=dt;if(nextT<=0)spawnCust();return}
  const c=cust,g=c.g;
  if(c.state!=='wait'){const tg=c.path[c.pi];if(!tg){return}
    const dx=tg[0]-g.position.x,dz=tg[1]-g.position.z,d=Math.hypot(dx,dz);
    if(d<.06){c.pi++;if(c.pi>=c.path.length){if(c.state==='enter'){c.state='wait';g.rotation.y=0;c.spr.visible=true;tone(700,.12,'sine',.12);tone(900,.12,'sine',.1)}else{scene.remove(g);cust=null;nextT=1.2}}}
    else{const s=Math.min(d,1.1*dt);g.position.x+=dx/d*s;g.position.z+=dz/d*s;g.rotation.y=Math.atan2(dx,dz);
      c.legs[0].rotation.x=Math.sin(ct*9)*.6;c.legs[1].rotation.x=-Math.sin(ct*9)*.6;g.position.y=Math.abs(Math.sin(ct*9))*.02;c.arm.rotation.x+=(1.3-c.arm.rotation.x)*Math.min(1,dt*6)}
    return}
  c.legs.forEach(l=>l.rotation.x=0);g.position.y=0;c.arm.rotation.x+=(0-c.arm.rotation.x)*Math.min(1,dt*6);
  c.shake=Math.max(0,c.shake-dt);c.spr.position.x=Math.sin(ct*40)*.04*(c.shake>0?1:0);
  hp.set(g.position.x+.22,1.32,g.position.z+.43);
  for(const it of items){const u=it.userData;if(u.dead||u.type==='money')continue;const d=it.position.distanceTo(hp);
    if(u.type===c.want&&d<.3){serve(c,it);return}
    if(d<.2&&c.shake<=0){c.shake=.5;tone(160,.25,'sawtooth',.1)}}}

// ---------- main loop ----------
const mouth=new T.Vector3(),fw=new T.Vector3();
let last=performance.now();
renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;
  hands.forEach(s=>handUpdate(s,now));
  items.slice().forEach(it=>phys(it,dt));
  for(const s of slots){if(s.item&&(s.item.userData.dead||s.item.position.distanceTo(s.pos)>.25)){s.item=null;s.tm=1.5}
    if(!s.item){s.tm-=dt;if(s.tm<=0)s.item=spawn(s.t,s.pos)}}
  fw.set(0,0,-1).applyQuaternion(camera.quaternion);mouth.copy(camera.position).addScaledVector(fw,.1);mouth.y-=.11;
  for(const it of items.slice()){const u=it.userData;if(u.held&&u.type!=='money'&&it.position.distanceTo(mouth)<.14){burst(it.position,defs[u.type].c);crunch();removeItem(it)}}
  custUpdate(dt);
  for(let i=parts.length-1;i>=0;i--){const m=parts[i],u=m.userData;u.l-=dt;u.v.y-=5*dt;m.position.addScaledVector(u.v,dt);m.scale.multiplyScalar(.985);
    if(u.l<=0){scene.remove(m);m.material.dispose();parts.splice(i,1)}}
  renderer.render(scene,camera)});

// ---------- enter VR ----------
const btn=document.getElementById('btn'),msg=document.getElementById('msg'),ui=document.getElementById('ui');
if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(!ok){btn.textContent='VR not supported here';btn.disabled=true}})}
else{btn.textContent='WebXR unavailable';btn.disabled=true;msg.textContent='Open this page over https in the Meta Quest Browser.'}
btn.onclick=async()=>{try{ac=ac||new AudioContext();ac.resume();
  const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});
  renderer.xr.setSession(s);ui.style.display='none';s.addEventListener('end',()=>{ui.style.display='flex';hands.forEach(h=>release(h,0))})}
  catch(e){msg.textContent='Could not start VR: '+e.message}};
</script></body></html>
